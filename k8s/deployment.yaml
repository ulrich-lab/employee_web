apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-web
  labels:
    app: employee-web
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: employee-web
  template:
    metadata:
      labels:
        app: employee-web
        version: v1.0.0
    spec:
      containers:
        - name: employee-web
          image: indrickvvims/employee-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: "cnps"
            - name: NEXT_PUBLIC_ENV
              value: "cnps"
---
apiVersion: v1
kind: Service
metadata:
  name: employee-web-service
  labels:
    app: employee-web
spec:
  type: NodePort
  selector:
    app: employee-web
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30188
      protocol: TCP
      name: http
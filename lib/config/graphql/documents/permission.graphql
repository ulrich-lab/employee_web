query GetEmployeeLeaves($limit: Int!, $offset: Int!, $employee: uuid = "") {
  leaves(limit: $limit, offset: $offset, order_by: {created_at: desc}, where: {employee_id: {_eq: $employee}}) {
    id
    status
    start_date
    leave_type
    end_date
    comment
    other_description
    employee {
      id
      license
      lastname
      firstname
      function
      file {
        id
        file_url
      }
      department {
        text_content {
          content
        }
      }
      service {
        text_content {
          content
        }
      }
    }
  }
}
mutation InsertLeave($start_date: date = null, $start_time: time = null, $other_description: String = null, $leave_type: String!, $end_date: date = null, $end_time: time = null, $comment: String = null, $employee_id: uuid! ) {
  insert_leaves_one(object: {status: "PENDING", start_date: $start_date, start_time: $start_time, other_description: $other_description, leave_type: $leave_type, end_date: $end_date, end_time: $end_time, comment: $comment, employee_id: $employee_id}) {
    id
  }
}

mutation UpdateLeave($id: uuid!, $leave_type: String, $end_date: date, $start_date: date, $other_description: String, $comment: String, $file: String) {
  update_leaves_by_pk(pk_columns: {id: $id}, _set: {leave_type: $leave_type, end_date: $end_date, start_date: $start_date, other_description: $other_description, comment: $comment, file: $file}){
    id
  }
}

mutation DeleteLeave($id: uuid!) {
  delete_leaves_by_pk(id: $id){
    id
  }
}


